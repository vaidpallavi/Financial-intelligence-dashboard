<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chief Finance Wiz — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0d12;color:#e9ebef;font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
  .box{width:100%;max-width:340px;padding:28px;background:#11151c;border:1px solid rgba(255,255,255,.08);border-radius:12px}
  .brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:#d4a537;box-shadow:0 0 8px #d4a537}
  .sub{font-size:12px;color:#5c6472;margin-bottom:22px}
  label{font-size:12px;color:#9aa3b2;display:block;margin-bottom:6px}
  input{width:100%;background:#161b24;border:1px solid rgba(255,255,255,.14);color:#e9ebef;padding:10px 12px;border-radius:6px;font-size:13px;font-family:'JetBrains Mono',monospace}
  input:focus{outline:none;border-color:#d4a537}
  button{width:100%;margin-top:16px;background:#d4a537;color:#141414;border:none;padding:10px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:#ef5350;font-size:12px;margin-top:12px;min-height:14px}
</style>
</head>
<body>
  <form class="box" id="loginForm">
    <div class="brand"><span class="dot"></span>CHIEF FINANCE WIZ</div>
    <div class="sub">Private demo — password required</div>
    <div style="font-size:10px;color:#5c6472;margin-top:-14px;margin-bottom:14px">Developed by Pallavi Vaid</div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus/>
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn'), err = document.getElementById('err');
      btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/';
      } catch (e2) {
        err.textContent = e2.message;
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
